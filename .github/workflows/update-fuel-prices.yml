name: Update fuel prices

# 触发时机(对齐 iOS repo 模式 — 周二/四/六 09:00 北京 = 01:00 UTC):
#   1. 定时:周二/四/六 01:00 UTC = 北京 09:00(发改委公告通常在 24:00 生效后的次日早上)
#   2. 手动:Actions tab 点 "Run workflow" 即时跑
on:
  schedule:
    - cron: '0 1 * * 2,4,6'
  workflow_dispatch:

# 让 GITHUB_TOKEN 有权限 push 回 main 分支
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 跑抓取脚本 — 从 qiyoujiage.com 抓北京 92#,merge 进 fuel-prices.json
      - name: Scrape and update fuel-prices.json
        run: |
          python3 update_fuel_prices.py -o fuel-prices.json
          echo "=== current fuel-prices.json head ==="
          head -50 fuel-prices.json

      # 2. 配置 git 身份并 commit & push(只在文件确实变了时)
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel-prices.json
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
          else
            git commit -m "chore: update fuel-prices.json $(date -u +%Y-%m-%d)"
            git push
          fi
